# PROD ENVIRONMENT - backend.conf
# Usage: terraform init -backend-config=backend.conf
#
# ⚠️  PRODUCTION — never hard-code these values.
#     Inject via CI/CD secrets (GitHub Actions secrets, GitLab CI variables, etc.)
#       terraform init -backend-config="bucket=$TF_STATE_BUCKET" \
#                      -backend-config="dynamodb_table=$TF_LOCK_TABLE"

bucket         = "myapp-terraform-state-prod"
key            = "prod/terraform.tfstate"
region         = "us-east-1"
dynamodb_table = "myapp-terraform-state-lock"
encrypt        = true
