# DEV ENVIRONMENT - backend.conf
# Usage: terraform init -backend-config=backend.conf
#
# ⚠️  Do NOT store real bucket names / account IDs in version control.
#     Replace the placeholder values below with your actual resources,
#     or inject them via CI/CD environment variables:
#       terraform init -backend-config="bucket=$TF_STATE_BUCKET" \
#                      -backend-config="dynamodb_table=$TF_LOCK_TABLE"

bucket         = "myapp-terraform-state-dev"
key            = "dev/terraform.tfstate"
region         = "us-east-1"
dynamodb_table = "myapp-terraform-state-lock"
encrypt        = true
